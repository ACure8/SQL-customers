<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="{{ url_for('static', filename='logos/white_w/2.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Error.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Error - WowFoods</title>
</head>
<body>
    <nav class="nav">
        <a href="{{ url_for('home_page') }}">
            <img id="logo" src="{{ url_for('static', filename='logos/white w logo.png') }}" alt="wowfoods-logo">
        </a>
        <div class="contentbar">
            <i class="ri-menu-fill"></i>
        </div>
        <div class="nav-buttons">
            <a href="{{ url_for('home_page') }}" id="navbutton" class="home">Home</a>
            <a href="{{ url_for('menu_page') }}" id="navbutton" class="menu">Menu</a>
            {% if current_user %}
                <a href="{{ url_for('accounts_page') }}" id="navbutton" class="calltoaction"><i class="ri-user-line" id="navi"></i>{{ current_user }}</a>
            {% else %}
                <a href="{{ url_for('signin_page') }}" id="navbutton" class="calltoaction"><i class="ri-user-line" id="navi"></i>Sign in</a>
            {% endif %}
            <a href="{{ url_for('cart_page') }}" id="navbutton" class="calltoaction"><i class="ri-shopping-cart-2-line" id="navi"></i>Cart</a>
        </div>
    </nav>

    <div class="error-container">
        
        <h1 class="error-code">{{ error_code }}</h1>
        <h2 class="error-title">{{ error_title }}</h2>
        
        <p class="error-message">{{ error_message }}</p>

        {% if error_details %}
        <div class="error-details">
            {{ error_details }}
        </div>
        {% endif %}

        <div class="error-actions">
            <a href="{{ url_for('home_page') }}" class="error-btn error-btn-primary">
                Go Home
            </a>
            <button class="error-btn error-btn-secondary" onclick="window.history.back()">
                ← Go Back
            </button>
        </div>
    </div>
</body>
</html>
